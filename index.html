<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Учитель началки — магазин</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--ink:#27334b;--muted:#7b8296;--purple:#d9c7f2;--mint:#b8d8d8;--pink:#f7d6e0;--peach:#ffe5b4;--bg:#fffdf8}*{box-sizing:border-box}body{margin:0;background:#e9e7f0;color:var(--ink);font-family:Manrope,sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:520px;min-height:100dvh;margin:auto;background:var(--bg);padding:18px 18px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-family:Nunito;font-size:21px;font-weight:900}.sub{font-size:11px;color:var(--muted)}.avatar{background:#eee4fb;border-radius:50%;width:43px;height:43px;display:grid;place-items:center;font-size:22px}.hero{border-radius:24px;background:linear-gradient(115deg,#e4d5f7,#d9f2e9 75%,#fff0d7);padding:23px;position:relative;overflow:hidden;min-height:184px}.hero h1{font:900 25px/1.12 Nunito;max-width:250px;margin:0 0 10px}.hero p{font-size:12px;max-width:230px;margin:0 0 16px}.hero .art{position:absolute;right:12px;bottom:15px;font-size:68px;filter:drop-shadow(0 7px 4px #9d92a355)}.btn{background:#7664ad;border:0;color:white;padding:11px 17px;border-radius:13px;font-weight:800;font-size:12px}.search{margin:17px 0;border-radius:14px;background:white;border:1px solid #eee8f3;padding:13px;width:100%;outline:none}.section{display:flex;justify-content:space-between;align-items:center;margin:21px 0 12px}.section h2{font:900 19px Nunito;margin:0}.section button{border:0;background:none;color:#7867aa;font-size:12px}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cat{border:0;border-radius:17px;padding:13px 6px;background:#f3ebfc;text-align:center;font:800 12px Nunito;min-height:87px}.cat:nth-child(3n+2){background:#e4f3ee}.cat:nth-child(3n){background:#fff0e0}.cat span{display:block;font-size:26px;margin-bottom:5px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{border:1px solid #f0edf2;border-radius:17px;background:white;overflow:hidden;text-align:left;padding:0;color:inherit}.cover{height:137px;display:grid;place-items:center;font-size:55px;background:linear-gradient(140deg,#f1e9ff,#fff0e3);position:relative}.product:nth-child(2n) .cover{background:linear-gradient(140deg,#e2f4ef,#ffe9f0)}.tag{position:absolute;left:9px;top:9px;background:white;border-radius:8px;padding:4px 7px;font-size:9px;font-weight:800}.pbody{padding:10px}.pbody b{display:block;font:800 13px/1.3 Nunito;min-height:34px}.pbody small{font-size:10px;color:var(--muted)}.pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.pfoot strong{font-size:11px;color:#7664ad}.heart{border:0;background:#f5f0fa;border-radius:9px;padding:6px;font-size:17px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:flex;justify-content:space-around;background:white;border-top:1px solid #f0ebf5;padding:9px 4px max(12px,env(safe-area-inset-bottom));z-index:3}.nav button{border:0;background:none;display:grid;gap:3px;justify-items:center;color:#8b8a99;font-size:9px;min-width:57px}.nav button i{font-style:normal;font-size:22px}.nav button.active{color:#7664ad;font-weight:800}.chiprow{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chip{border:1px solid #e8e0f0;background:white;border-radius:30px;padding:8px 12px;white-space:nowrap;font-size:11px}.chip.on{background:#e9dcf7;border-color:#e9dcf7}.empty{background:#f7f1fa;border-radius:18px;padding:25px;text-align:center;color:#666;line-height:1.6}.detailCover{height:230px;border-radius:24px;background:linear-gradient(120deg,#e4d8f7,#d8f3e8);display:grid;place-items:center;font-size:110px;margin-top:15px}.back{border:0;background:none;color:#7867aa;font-weight:800;padding:6px 0}.panel{background:white;border:1px solid #f0eaf4;border-radius:18px;padding:17px;margin:12px 0}.pill{background:#e9f3ee;border-radius:12px;padding:7px 10px;display:inline-block;font-size:11px;margin:4px}.overlay{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:center;padding:25px}.welcome{text-align:center;max-width:340px}.welcome .illustration{font-size:90px}.welcome h1{font:900 32px Nunito}.welcome p{line-height:1.7;color:var(--muted)}.notice{font-size:11px;color:#8c8396;margin-top:10px}.filters{display:flex;gap:8px;margin-bottom:12px}.filters select{min-width:0;flex:1;background:white;border:1px solid #eee5f1;border-radius:10px;padding:9px;font-size:11px}</style></head><body><div id="app"></div><script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){};const products=[{id:1,title:'Карточки-правила по русскому языку',cat:'Карточки',grade:'1 класс',subject:'Русский язык',icon:'📚',free:true},{id:2,title:'Пиратское математическое приключение',cat:'Игры',grade:'2 класс',subject:'Математика',icon:'🏴‍☠️',free:false},{id:3,title:'Осенние рабочие листы',cat:'Рабочие листы',grade:'2 класс',subject:'Русский язык',icon:'🍂',free:true},{id:4,title:'Интерактивная презентация по математике',cat:'Презентации',grade:'3 класс',subject:'Математика',icon:'💻',free:false},{id:5,title:'Контрольная работа за четверть',cat:'Контрольные',grade:'4 класс',subject:'Русский язык',icon:'📝',free:true},{id:6,title:'Волшебные свитки — игра',cat:'Игры',grade:'3 класс',subject:'Русский язык',icon:'📜',free:true}];const categories=[['Игры','🎮'],['Презентации','🖥️'],['Рабочие листы','📝'],['Карточки','📚'],['Контрольные','✏️'],['Все материалы','🎁']];let state={tab:'Главная',cat:'Все материалы',grade:'Все классы',subject:'Все предметы',query:'',detail:null};let favorites=JSON.parse(localStorage.getItem('nb_favorites')||'[]');let library=JSON.parse(localStorage.getItem('nb_library')||'[]');let greeted=localStorage.getItem('nb_greeted');const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(p){return `<div class="product" onclick="detail(${p.id})"><div class="cover"><span class="tag">${p.free?'Бесплатно':'Демо'}</span>${p.icon}</div><div class="pbody"><b>${esc(p.title)}</b><small>${p.grade} · ${p.subject}</small><div class="pfoot"><strong>${p.free?'Бесплатно':'Скоро'}</strong><button class="heart" onclick="event.stopPropagation();fav(${p.id})">${favorites.includes(p.id)?'♥':'♡'}</button></div></div></div>`}function list(items){return items.length?`<div class="products">${items.map(card).join('')}</div>`:'<div class="empty">Материалы пока не найдены. Попробуйте изменить фильтры.</div>'}function filtered(){return products.filter(p=>(state.cat==='Все материалы'||p.cat===state.cat)&&(state.grade==='Все классы'||p.grade===state.grade)&&(state.subject==='Все предметы'||p.subject===state.subject)&&(!state.query||[p.title,p.cat,p.subject].join(' ').toLowerCase().includes(state.query.toLowerCase())))}function filters(){return `<div class="filters"><select onchange="state.grade=this.value;render()">${['Все классы','1 класс','2 класс','3 класс','4 класс'].map(x=>`<option ${state.grade===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="state.subject=this.value;render()">${['Все предметы','Русский язык','Математика'].map(x=>`<option ${state.subject===x?'selected':''}>${x}</option>`).join('')}</select></div>`}function header(){let name=tg?.initDataUnsafe?.user?.first_name;return `<div class="top"><div><div class="brand">📚 Учитель началки</div><div class="sub">Быстро и по делу${name?' · Привет, '+esc(name):''}</div></div><div class="avatar">👩‍🏫</div></div>`}function home(){return `<div class="hero"><h1>Готовые материалы для ваших уроков</h1><p>Игры, презентации и рабочие листы в одном месте</p><button class="btn" onclick="go('Каталог')">Смотреть каталог</button><div class="art">📱📚</div></div><input class="search" placeholder="🔎 Найти материал..." value="${esc(state.query)}" oninput="state.query=this.value;renderProductsOnly()"><div class="section"><h2>Категории</h2><button onclick="go('Каталог')">Все разделы →</button></div><div class="cats">${categories.map(([n,i])=>`<button class="cat" onclick="chooseCat('${n}')"><span>${i}</span>${n}</button>`).join('')}</div><div class="section"><h2>Подборка материалов</h2><button onclick="go('Каталог')">Все →</button></div><div id="homeProducts">${list(filtered().slice(0,4))}</div><p class="notice">Демонстрационный каталог. Товары и обложки временные.</p>`}function catalog(){return `<h2 style="font:900 25px Nunito">Каталог материалов</h2><input class="search" placeholder="🔎 Поиск по названию..." value="${esc(state.query)}" oninput="state.query=this.value;renderProductsOnly()"><div class="chiprow">${categories.map(([n])=>`<button class="chip ${state.cat===n?'on':''}" onclick="chooseCat('${n}')">${n}</button>`).join('')}</div>${filters()}<div id="catalogProducts">${list(filtered())}</div>`}function free(){return `<h2 style="font:900 25px Nunito">🎁 Бесплатные материалы</h2><div class="panel">Здесь будут открытые материалы и особые подарки подписчикам. Проверку подписки подключим позже.</div>${list(products.filter(p=>p.free))}` }function favPage(){return `<h2 style="font:900 25px Nunito">♡ Избранное</h2>${list(products.filter(p=>favorites.includes(p.id)))}` }function profile(){const u=tg?.initDataUnsafe?.user;return `<h2 style="font:900 25px Nunito">Мой профиль</h2><div class="panel"><div style="font-size:40px">👩‍🏫</div><h3>${esc(u?.first_name||'Гость магазина')}</h3><div class="sub">${u?'Профиль Telegram (демо)':'Откройте через Telegram для отображения имени'}</div></div><h3>📚 Моя библиотека</h3>${library.length?list(products.filter(p=>library.includes(p.id))):'<div class="empty">Здесь появятся полученные материалы.</div>'}<p class="notice">В демо избранное и библиотека сохраняются только в этом браузере. Облачная синхронизация будет после подключения базы данных.</p>`}function detail(id){state.detail=id;render()}function productDetail(){const p=products.find(p=>p.id===state.detail);if(!p)return '';return `<button class="back" onclick="state.detail=null;render()">← Назад</button><div class="detailCover">${p.icon}</div><h2 style="font:900 25px Nunito">${esc(p.title)}</h2><div><span class="pill">${p.grade}</span><span class="pill">${p.subject}</span><span class="pill">${p.cat}</span></div><div class="panel"><b>Описание</b><p>Демонстрационная карточка. Здесь появятся фотографии, подробное описание и состав комплекта.</p></div><button class="btn" style="width:100%" onclick="getDemo(${p.id})">Добавить в мою библиотеку (демо)</button><button class="btn" style="width:100%;margin-top:10px;background:#b8a4d8" onclick="alert('Скачивание станет доступно после загрузки настоящего файла.')">Скачать файл — скоро</button><button class="btn" style="width:100%;margin-top:10px;background:#aacfc8" onclick="alert('Отправка через бота будет подключена после настройки сервера.')">Получить в Telegram — скоро</button>`}function getDemo(id){if(!library.includes(id)){library.push(id);localStorage.setItem('nb_library',JSON.stringify(library))}alert('Товар добавлен в демо-библиотеку. Настоящий файл пока не прикреплён.')}function fav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('nb_favorites',JSON.stringify(favorites));render()}function go(tab){state.tab=tab;state.detail=null;render()}function chooseCat(cat){state.cat=cat;go('Каталог')}function renderProductsOnly(){if($('#homeProducts'))$('#homeProducts').innerHTML=list(filtered().slice(0,4));if($('#catalogProducts'))$('#catalogProducts').innerHTML=list(filtered())}function render(){const pages={'Главная':home,'Каталог':catalog,'Бесплатно':free,'Избранное':favPage,'Профиль':profile};$('#app').innerHTML=header()+(state.detail?productDetail():pages[state.tab]())+`<div class="nav">${[['Главная','⌂'],['Каталог','▦'],['Бесплатно','🎁'],['Избранное','♡'],['Профиль','♙']].map(([n,i])=>`<button class="${state.tab===n?'active':''}" onclick="go('${n}')"><i>${i}</i>${n}</button>`).join('')}</div>`+(greeted?'':`<div class="overlay"><div class="welcome"><div class="illustration">📚✨</div><h1>Учитель началки</h1><p>Быстро и по делу! Добро пожаловать в магазин готовых материалов для ваших уроков.</p><button class="btn" onclick="localStorage.setItem('nb_greeted','1');greeted=true;render()">Начать знакомство</button></div></div>`)}render();
</script></body></html>
